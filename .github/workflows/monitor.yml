name: Monitor Zelda stock

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: zelda-stock-monitor
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run rule tests
        working-directory: monitor
        run: npm run test:rules

      - name: Check retailers
        working-directory: monitor
        env:
          REMOTE_STATUS_URL: https://raw.githubusercontent.com/${{ github.repository }}/status/status.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPO_PUSH_TOKEN: ${{ secrets.EXPO_PUSH_TOKEN }}
        run: npm run monitor

      - name: Publish latest status to single-commit status branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/zelda-status
          cp monitor/status.json /tmp/zelda-status/status.json
          cd /tmp/zelda-status
          git init
          git checkout -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Update stock status"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin status
